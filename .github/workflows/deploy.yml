name: Deploy verified production
on: workflow_dispatch
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          MONGO_TEST_URL: mongodb://127.0.0.1:27017
          MONGO_TEST_DATABASE: ztcg_test_ci_${{ github.run_id }}_${{ github.run_attempt }}
      - name: Check credentials
        run: test -n "$VERCEL_TOKEN" && test -n "$VERCEL_ORG_ID" && test -n "$VERCEL_PROJECT_ID"
      - run: npx --yes vercel@62.4.0 pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: npx --yes vercel@62.4.0 deploy --prod --yes --token="$VERCEL_TOKEN"
      - name: Smoke test
        run: curl --fail --retry 3 https://ztcg.vercel.app/ready && curl --fail https://ztcg.vercel.app/HTML/index.html
