name: Verify
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          NODE_OPTIONS: --max-old-space-size=2048
          MONGO_TEST_URL: mongodb://127.0.0.1:27017
          MONGO_TEST_DATABASE: ztcg_test_ci_${{ github.run_id }}_${{ github.run_attempt }}
