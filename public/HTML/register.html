<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Conta · Zacornia</title>
    <link rel="icon" href="/assets/icons/favicon.svg" />
    <link rel="stylesheet" href="/CSS/app.css" />
    <script type="module" src="/JS/account-form.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">ZACORNIA <small>TRADING CARD GAME</small></a>
      <nav aria-label="Principal">
        <a href="/">Decks</a><a href="/HTML/index.html">Jogar</a
        ><a href="/HTML/perfil.html">Perfil</a>
      </nav>
      <div id="account" class="account"></div>
    </header>
    <main class="auth-shell">
      <section class="auth-box">
        <p class="eyebrow">COMECE SUA EXPEDIÇÃO</p>
        <h1>Crie sua conta</h1>
        <form id="auth-form" data-mode="register">
          <label
            >Nome de jogador<input
              name="nome"
              minlength="2"
              maxlength="80"
              autocomplete="nickname"
              required /></label
          ><label
            >Email<input
              name="email"
              type="email"
              autocomplete="email"
              required /></label
          ><label
            >Senha<input
              name="senha"
              type="password"
              minlength="8"
              maxlength="72"
              autocomplete="new-password"
              required /></label
          ><label
            >Confirme a senha<input
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              required /></label
          ><button class="primary">Criar conta</button>
        </form>
        <p class="hint">Já tem conta? <a href="/HTML/login.html">Entrar</a>.</p>
      </section>
    </main>
    <p id="message" class="message" role="status" aria-live="polite" hidden></p>
  </body>
</html>
