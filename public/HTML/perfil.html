<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Conta · Zacornia</title>
    <link rel="icon" href="/assets/icons/favicon.svg" />
    <link rel="stylesheet" href="/CSS/app.css" />
    <link rel="stylesheet" href="/CSS/battle.css" />
    <link rel="stylesheet" href="/CSS/profile.css" />
    <link rel="stylesheet" href="/CSS/social.css" />
    <script type="module" src="/JS/profile.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">ZACORNIA <small>TRADING CARD GAME</small></a>
      <nav aria-label="Principal">
        <a href="/">Decks</a><a href="/HTML/index.html">Jogar</a
        ><a href="/HTML/perfil.html">Perfil</a>
      </nav>
      <div id="account" class="account"></div>
    </header>
    <main class="page profile-page">
      <section class="profile-hero" aria-label="Perfil do duelista">
        <div class="profile-cover">
          <p class="eyebrow">ZACORNIA · DUELISTAS</p>
          <span class="cover-rune" aria-hidden="true">✧</span>
        </div>
        <div class="profile-identity">
          <img
            id="avatar"
            class="profile-avatar"
            src="/assets/avatar.png"
            alt="Avatar do jogador"
          />
          <div class="profile-identity-content">
            <p class="eyebrow">SUA JORNADA</p>
            <div class="profile-name-line">
              <h1 id="player-name">Carregando…</h1>
              <span class="level-medal"
                >Nível <strong id="level">1</strong></span
              >
            </div>
            <p id="profile-subtitle" class="muted"></p>
            <div class="profile-actions">
              <div
                id="profile-friendship"
                class="friendship-actions"
                hidden
              ></div>
              <button id="share-profile" class="quiet" disabled>
                Copiar link do perfil
              </button>
            </div>
          </div>
          <aside
            id="player-title-badge"
            class="title-badge"
            aria-label="Título do duelista"
            hidden
          >
            <span class="title-badge-rune" aria-hidden="true">✦</span>
            <span
              ><small>TÍTULO DO DUELISTA</small
              ><strong id="player-title"></strong
            ></span>
          </aside>
        </div>
        <div
          id="stats"
          class="profile-stats"
          aria-label="Estatísticas do jogador"
        ></div>
        <div class="level-track">
          <div>
            <strong id="level-label"></strong><span id="level-caption"></span>
          </div>
          <progress
            id="level-progress"
            value="0"
            max="100"
            aria-label="Progresso de nível"
          ></progress>
          <p id="experience-caption" class="hint"></p>
          <div
            id="experience-streaks"
            class="experience-streaks"
            aria-label="Sequências e multiplicadores"
          ></div>
          <a href="/regras#experiencia" class="hint"
            >Como ganhar XP e subir de nível →</a
          >
        </div>
        <nav class="profile-tabs" aria-label="Seções do perfil">
          <a href="#decks-section">Baralhos</a
          ><a href="#history-section">Histórico</a
          ><a href="/HTML/friends.html">Encontrar jogadores</a>
        </nav>
      </section>
      <details id="edit-section" class="surface profile-edit" hidden>
        <summary>Editar meu perfil</summary>
        <form id="profile-form">
          <label
            >Nome<input
              id="name"
              minlength="4"
              maxlength="80"
              required /></label
          ><label
            >Avatar (PNG, JPG ou WebP; até 200 KB)<input
              id="photo"
              type="file"
              accept="image/png,image/jpeg,image/webp" /></label
          ><button class="primary">Salvar perfil</button>
        </form>
      </details>
      <section id="decks-section" class="surface profile-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">ESTRATÉGIAS</p>
            <h2 id="decks-title">Baralhos</h2>
          </div>
          <span id="deck-count" class="muted"></span>
        </div>
        <p id="deck-privacy" class="hint"></p>
        <div id="decks" class="profile-decks"></div>
      </section>
      <section id="history-section" class="surface profile-section">
        <div class="section-heading">
          <div>
            <p class="eyebrow">NO CAMPO DE BATALHA</p>
            <h2>Histórico de partidas</h2>
          </div>
          <span id="history-total" class="muted"></span>
        </div>
        <div id="history" class="profile-history"></div>
        <button id="more-history" class="quiet" hidden>
          Mostrar mais partidas
        </button>
      </section>
      <dialog id="profile-deck-dialog" class="profile-deck-dialog">
        <div class="section-heading">
          <h2 id="profile-deck-title"></h2>
          <button id="close-profile-deck" class="quiet" autofocus>
            Fechar baralho
          </button>
        </div>
        <div id="profile-deck-cards" class="profile-card-grid"></div>
      </dialog>
    </main>
    <p id="message" class="message" role="status" aria-live="polite" hidden></p>
  </body>
</html>
