<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Nova senha · Zacornia</title>
    <link rel="stylesheet" href="/CSS/app.css" />
    <script type="module" src="/JS/password-recovery.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">ZACORNIA <small>TRADING CARD GAME</small></a>
      <nav aria-label="Principal"><a href="/HTML/login.html">Entrar</a></nav>
    </header>
    <main class="auth-shell">
      <section class="auth-box">
        <h1>Definir nova senha</h1>
        <form id="password-form" data-mode="reset">
          <label
            >Nova senha<input
              name="senha"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="72"
              required /></label
          ><label
            >Confirme a nova senha<input
              name="confirmPassword"
              type="password"
              autocomplete="new-password"
              minlength="8"
              maxlength="72"
              required /></label
          ><button class="primary">Alterar senha</button>
        </form>
        <p id="recovery-result" role="status" hidden></p>
        <a href="/HTML/forgot-password.html">Solicitar outro link</a>
        <p><a href="/HTML/login.html">Voltar para entrar</a></p>
      </section>
    </main>
    <p id="message" class="message" role="status" aria-live="polite" hidden></p>
  </body>
</html>
