<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Conta · Zacornia</title>
    <link rel="icon" href="/assets/icons/favicon.svg" />
    <link rel="stylesheet" href="/CSS/app.css" />
    <script type="module" src="/JS/account-form.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">ZACORNIA <small>TRADING CARD GAME</small></a>
      <nav aria-label="Principal">
        <a href="/">Decks</a><a href="/HTML/index.html">Jogar</a
        ><a href="/HTML/perfil.html">Perfil</a>
      </nav>
      <div id="account" class="account"></div>
    </header>
    <main class="auth-shell">
      <section class="auth-box">
        <p class="eyebrow">BEM-VINDO DE VOLTA</p>
        <h1>Entre na sua conta</h1>
        <p class="muted">Seus baralhos, prontos para a próxima partida.</p>
        <form id="auth-form" data-mode="login">
          <label
            >Email<input
              name="email"
              type="email"
              autocomplete="email"
              required /></label
          ><label
            >Senha<input
              name="senha"
              type="password"
              autocomplete="current-password"
              required /></label
          ><label class="remember"
            ><input name="lembrar" type="checkbox" />Lembrar nesta
            máquina</label
          ><button class="primary">Entrar</button>
        </form>
        <p><a href="/HTML/forgot-password.html">Esqueci minha senha</a></p>
        <p class="hint">
          Ainda não tem uma conta?
          <a href="/HTML/register.html">Cadastre-se</a>.
        </p>
      </section>
    </main>
    <p id="message" class="message" role="status" aria-live="polite" hidden></p>
  </body>
</html>
