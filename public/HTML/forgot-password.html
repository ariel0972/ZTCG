<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Recuperar senha · Zacornia</title>
    <link rel="stylesheet" href="/CSS/app.css" />
    <script type="module" src="/JS/password-recovery.js"></script>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">ZACORNIA <small>TRADING CARD GAME</small></a>
      <nav aria-label="Principal">
        <a href="/">Decks</a><a href="/HTML/index.html">Jogar</a
        ><a href="/HTML/login.html">Entrar</a>
      </nav>
    </header>
    <main class="auth-shell">
      <section class="auth-box">
        <h1>Recuperar senha</h1>
        <p>Receba um link no e-mail da sua conta.</p>
        <form id="password-form" data-mode="forgot">
          <label
            >E-mail<input
              name="email"
              type="email"
              autocomplete="email"
              maxlength="254"
              required /></label
          ><button class="primary">Enviar link</button>
        </form>
        <p id="recovery-result" role="status" hidden></p>
        <a href="/HTML/login.html">Voltar para entrar</a>
      </section>
    </main>
    <p id="message" class="message" role="status" aria-live="polite" hidden></p>
  </body>
</html>
